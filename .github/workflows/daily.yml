name: 日次モメンタム実行（サーバ不要・無料）

# 常時起動サーバ(Render・$7/月)の代わり。毎朝 JST 7:00 に一度だけ起動して、
# 地合い判定→必要ならリバランス→株通知→損益サマリー→状態をcommit して終了する。
# 手動実行(Run workflow)では job を rebalance / stocks / report に切り替えられる。

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 07:00 JST（毎日）。JSTは夏時間なし
  workflow_dispatch:
    inputs:
      job:
        description: "実行内容"
        required: true
        default: "auto"
        type: choice
        options: [auto, rebalance, stocks, report]

# 状態ファイル(state/cron_state.json)を commit で書き戻すために書き込み権限が必要
permissions:
  contents: write

concurrency:
  group: daily-momentum
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ---- 秘密情報（GitHubの Settings > Secrets and variables > Actions に登録）----
      EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
      EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      # ---- 運用設定（秘密ではない。render.yaml のモメンタム関連と同じ値）----
      TRADING_MODE: LIVE
      EXCHANGE_ID: bitbank
      STRATEGY: momentum
      NOTIFY_ENABLED: "true"
      NOTIFY_RESTORE: "false"
      # ADA/JPY は除外＝入金した保有ADAをbotに取り込ませない/売買させない（隔離）
      ALLOWED_SYMBOLS: "BTC/JPY,ETH/JPY,DOGE/JPY,LTC/JPY,ATOM/JPY,DOT/JPY,SOL/JPY,AVAX/JPY,BCH/JPY,BNB/JPY,TRX/JPY,XLM/JPY,SUI/JPY,QTUM/JPY,MKR/JPY,SAND/JPY,BAT/JPY,MANA/JPY,LPT/JPY"
      SYMBOL_MAP: "BTCUSDT=BTC/JPY,XRPUSDT=XRP/JPY,ETHUSDT=ETH/JPY,SOLUSDT=SOL/JPY,DOGEUSDT=DOGE/JPY,LTCUSDT=LTC/JPY,DOTUSDT=DOT/JPY,LINKUSDT=LINK/JPY,AVAXUSDT=AVAX/JPY,ATOMUSDT=ATOM/JPY,XLMUSDT=XLM/JPY"
      ORDER_QUOTE_AMOUNT: "9000"   # 1発注=固定¥9,000（総資産に釣られない固定額運用）
      ORDER_SIZE_PCT: "0"
      MIN_ORDER_JPY: "100"
      MAX_OPEN_POSITIONS: "8"
      ORDER_COOLDOWN_SEC: "60"
      ORDER_ENTRY_TYPE: "limit"
      MAKER_WAIT_SEC: "25"
      MAX_DAILY_LOSS_PCT: "0.08"
      CRYPTO_MOM_TOP: "5"
      CRYPTO_MOM_LOOKBACK: "90"
      CRYPTO_MOM_REBAL: "30"
      CRYPTO_REGIME_FILTER: "true"    # 地合いフィルター（等ウェイト指数が200日線割れの弱気は全て現金）
      CRYPTO_PAPER_ENABLED: "false"
      # 株モメンタム（日本大型株82・月次通知・売買なし）
      STOCKS_ENABLED: "true"
      STOCKS_MOM_TOP: "8"
      STOCKS_MOM_LOOKBACK: "126"
      CRON_JOB: ${{ github.event.inputs.job || 'auto' }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python 3.11 を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 日次バッチを実行
        run: python -m scripts.cron_run

      - name: 状態ファイルの変更をcommit（次回へ引き継ぐ）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/cron_state.json || true
          if git diff --cached --quiet; then
            echo "状態に変更なし（commitしません）"
          else
            git commit -m "chore: 日次バッチの状態を更新 [skip ci]"
            git push
          fi
